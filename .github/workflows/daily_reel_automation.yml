name: 24/7 Autonomous Instagram Reel Automation

on:
  schedule:
    # Runs twice daily at peak Indian engagement hours: 12:00 PM IST (06:30 UTC) and 7:00 PM IST (13:30 UTC)
    - cron: '30 6,13 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Story topic key (e.g. karna_secret, abhimanyu_chakravyuh, krishna_vow, ashwatthama_curse, eklavya_thumb, or auto)'
        required: true
        default: 'auto'
      upload:
        description: 'Upload directly to Instagram (true/false)'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  publish_reel:
    name: Generate & Publish Reel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System FFmpeg & Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-noto-core fonts-freefont-ttf

      - name: 📚 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Autonomous Reel Producer
        id: producer
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: |
          UPLOAD_FLAG=""
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then
            UPLOAD_FLAG="--no-upload"
          fi
          TOPIC="${{ github.event.inputs.topic || 'auto' }}"
          python auto_runner.py --topic "$TOPIC" $UPLOAD_FLAG

      - name: 💾 Backup Reel Package as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-packages-${{ github.run_number }}
          path: output/ready_to_upload/
          retention-days: 30

      - name: 🔄 Commit Updated History Back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --staged --quiet || (git commit -m "chore: record published reel in posted_history.json [skip ci]" && git push)
